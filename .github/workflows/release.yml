name: release

# Pakete für Windows und Linux bauen. Bei einem Tag „v*“ werden sie an ein
# GitHub-Release gehängt, sonst nur als Artefakte des Laufs gespeichert.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            archive: jdfpdf-windows-x64.zip
          - os: ubuntu-22.04  # ältere glibc: läuft auf mehr Distributionen
            archive: jdfpdf-linux-x64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Qt-Systembibliotheken (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install . pyinstaller
      - run: pyinstaller packaging/jdfpdf.spec --noconfirm
      - name: Paket prüfen
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          JDFPDF_SMOKE_TEST: "1"
        run: |
          python -c "import sys; sys.path.insert(0, 'tests'); from conftest import make_pdf; make_pdf('probe.pdf')"
          dist/jdfpdf/jdfpdf-cli probe.pdf -o probe-out --softproof --ppf --preflight --finishing-jdf --staple top_left
          test -f probe-out/probe_proof.pdf && test -f probe-out/probe_001.ppf
          dist/jdfpdf/jdfpdf probe.pdf
      - name: Archiv (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/jdfpdf -DestinationPath ${{ matrix.archive }}
      - name: Archiv (Linux)
        if: runner.os == 'Linux'
        run: tar -C dist -czf ${{ matrix.archive }} jdfpdf
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.archive }}
          generate_release_notes: true
