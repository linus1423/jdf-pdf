name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Qt-Systembibliotheken und LibreOffice (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
          sudo apt-get install -y --no-install-recommends libreoffice-writer-nogui
          echo "JDFPDF_TEST_LIBREOFFICE=1" >> "$GITHUB_ENV"
      - run: pip install -e .[dev]
      - run: pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
