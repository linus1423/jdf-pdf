[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jdfpdf"
version = "0.1.0"
description = "Druckvorbereitung: PDF bearbeiten und JDF/PPF einbetten"
requires-python = ">=3.10"
readme = "README.md"
# Bewusst nur Bibliotheken ohne AGPL (kein PyMuPDF, kein Ghostscript).
dependencies = [
    "PySide6>=6.6",      # LGPL-3.0
    "pikepdf>=8.0",      # MPL-2.0
    "pypdfium2>=4.20",   # Apache-2.0 / BSD-3
    "lxml>=5.0",         # BSD
    "reportlab>=4.0",    # BSD (Stempel, Marken, Barcodes)
    "Pillow>=11.0",      # MIT-CMU (HPND)
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jdfpdf-cli = "jdfpdf.cli:main"

[project.gui-scripts]
jdfpdf = "jdfpdf.ui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
